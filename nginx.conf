server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Cache static assets aggressively ─────────────────────────────────────
    # Vite outputs hashed filenames — safe to cache forever
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|webp|avif|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA HTML documents → Laravel spa-shell (per-path meta injection) ─────
    # Real files (robots.txt, favicon, etc.) stay on disk. Missing paths and /
    # proxy to the API so crawlers/social scrapers see route-specific <head>.
    # ${SPA_SHELL_API_ORIGIN} is substituted at container start (see Dockerfile).
    # Nginx vars use $$ so the official image envsubst leaves them alone.
    location / {
        try_files $$uri @spa_shell;
    }

    location @spa_shell {
        proxy_http_version 1.1;
        proxy_set_header X-Original-URI $$request_uri;
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$scheme;
        proxy_set_header X-Forwarded-Host $$host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa_shell_fallback;
        proxy_pass ${SPA_SHELL_API_ORIGIN}/spa-shell?path=$$uri;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # If the API shell is unreachable, boot the SPA from local index.html
    # (generic <title> only — better than a hard 502 on www).
    location @spa_shell_fallback {
        rewrite ^ /index.html break;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Health check endpoint (used by Coolify) ───────────────────────────────
    location /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
